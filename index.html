<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shopping Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; text-align: center; }
        header { background-color: #232f3e; color: white; padding: 15px; font-size: 24px; font-weight: bold; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .product-card { background: white; border: 1px solid #ddd; margin: 15px; padding: 15px; border-radius: 8px; width: 280px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { max-width: 100%; height: auto; border-radius: 5px; }
        .product-title { font-size: 18px; font-weight: bold; margin: 10px 0; color: #333; }
        .product-price { color: #B12704; font-size: 20px; font-weight: bold; margin: 5px 0; }
        .buy-btn { display: inline-block; background-color: #ffd814; color: #111; padding: 10px 20px; text-decoration: none; border-radius: 20px; font-weight: bold; margin-top: 10px; border: 1px solid #fcd200; }
        .buy-btn:hover { background-color: #f7ca00; }
    </style>
</head>
<body>

    <header>🛍️ मेरा बेस्ट शॉपिंग स्टोर 🛍️</header>
    <p style="margin-top: 20px; font-size: 16px; color: #666;">यहाँ आपको मिलेंगे सबसे बेहतरीन प्रोडक्ट्स सबसे कम दामों पर!</p>

    <div class="container">
        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/71GLMJ764xL._SX679_.jpg" alt="Product 1">
            <div class="product-title">स्टाइलिश ब्लूटूथ हेडफोन्स (Wireless)</div>
            <div class="product-price">₹1,499</div>
            <a href="#" target="_blank" class="buy-btn">अभी खरीदें (Buy Now)</a>
        </div>

        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/61SSVxTSsBL._SX679_.jpg" alt="Product 2">
            <div class="product-title">स्मार्ट वॉच (Fitness Tracker)</div>
            <div class="product-price">₹2,499</div>
            <a href="#" target="_blank" class="buy-btn">अभी खरीदें (Buy Now)</a>
        </div>

        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/71657TiFeHL._SX679_.jpg" alt="Product 3">
            <div class="product-title">प्रीमियम मेन्स वॉच (Classic Black)</div>
            <div class="product-price">₹1,999</div>
            <a href="#" target="_blank" class="buy-btn">अभी खरीदें (Buy Now)</a>
        </div>
    </div>

</body>
</html>
